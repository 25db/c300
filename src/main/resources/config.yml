# VillagerTradesEdit 配置
# ============================================================
# 全局设置
settings:
  # 是否在玩家右键村民时自动覆盖交易
  apply-on-interact: true
  # 是否在村民生成 / 升级时自动覆盖交易
  apply-on-spawn: true
  # 覆盖模式:
  #   REPLACE  -> 完全替换为下面定义的交易
  #   APPEND   -> 在原交易后追加
  #   PREPEND  -> 在原交易前插入
  mode: REPLACE
  # 是否限制交易次数 (0 = 无限)
  max-uses: 0
  # 是否给村民奖励经验 (村民升级所需)
  reward-exp: true
  # 物品使用次数后是否消耗 (价格提升)
  price-multiplier: 0.05

# ============================================================
# 交易定义
# trades:
#   <职业>:
#     <等级 1-5>:
#       - give1: <第一件输入物品 Material>
#         give1_amount: <数量>
#         give2: <第二件输入物品 Material, 可选>
#         give2_amount: <数量>
#         result: <输出物品 Material>
#         result_amount: <数量>
#         max_uses: <最大使用次数, 可选, 默认读取全局>
#
# 职业: NONE, ARMORER, BUTCHER, CARTOGRAPHER, CLERIC, FARMER,
#       FISHERMAN, FLETCHER, LEATHERWORKER, LIBRARIAN, MASON,
#       NITWIT, SHEPHERD, TOOLSMITH, WEAPONSMITH
# ============================================================
